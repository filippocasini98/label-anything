name: Build di test (senza release)

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Installa dipendenze di build
        run: pip install -r requirements-build.txt pyinstaller

      - name: Build con PyInstaller
        run: pyinstaller --noconfirm label-anything.spec
        env:
          APP_VERSION: test

      - name: Librerie Qt di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Smoke test
        run: |
          mkdir -p smoke/img
          python - <<'PY'
          import numpy as np, cv2
          for i in range(2):
              cv2.imwrite(f"smoke/img/img_{i}.png", np.zeros((32, 32, 3), dtype=np.uint8))
          PY
          set +e
          QT_QPA_PLATFORM=offscreen timeout 20 dist/LabelAnything/LabelAnything smoke/img
          codice=$?
          set -e
          [ "$codice" -eq 124 ] || { echo "Smoke test fallito (exit $codice)"; exit 1; }
          echo "Smoke test OK: l'app e' rimasta in esecuzione 20s senza crash"

      - name: Dimensione pacchetto
        run: |
          zip -r LabelAnything-linux64-test.zip dist/LabelAnything
          du -sh dist/LabelAnything
          du -h LabelAnything-linux64-test.zip
