name: Release automatica al merge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      versione: ${{ steps.versione.outputs.prossima }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcola la prossima versione
        id: versione
        run: |
          ultima=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$ultima" ]; then
            echo "prossima=v1.0.0" >> "$GITHUB_OUTPUT"
            echo "precedente=" >> "$GITHUB_OUTPUT"
          else
            minor=$(echo "$ultima" | sed -E 's/^v[0-9]+\.([0-9]+)\.[0-9]+$/\1/')
            echo "prossima=v1.$((minor + 1)).0" >> "$GITHUB_OUTPUT"
            echo "precedente=$ultima" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepara le note della release
        run: |
          {
            echo "Novita' dalla versione ${precedente:-inizio}:"
            echo
            echo "- Self-contained binaries for Windows, macOS and Linux"
            echo
            git log --pretty=format:'- %s' "${precedente}..HEAD" 2>/dev/null || git log --pretty=format:'- %s' HEAD
          } > note.md
        env:
          precedente: ${{ steps.versione.outputs.precedente }}

      - name: Pacchetto Source-code.zip
        run: git archive --format=zip -o Source-code.zip HEAD  # il tag esiste solo dallo step successivo

      - name: Crea tag e release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          prossima: ${{ steps.versione.outputs.prossima }}
        run: |
          git tag "$prossima"
          git push origin "$prossima"
          gh release create "$prossima" Source-code.zip \
            --title "Label Anything $prossima" \
            --notes-file note.md

      - name: Pulizia binari release vecchie (ultime 2 conservate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # elimina gli asset binari dalle release piu' vecchie, tenendo le 2 piu' recenti
          mapfile -t vecchie < <(gh release list --limit 100 --json tagName --jq '.[].tagName' | tail -n +3)
          for rel in "${vecchie[@]}"; do
            [ -z "$rel" ] && continue
            mapfile -t asset < <(gh release view "$rel" --json assets --jq '.assets[].name' | grep '^LabelAnything-.*\.zip$') || continue
            for a in "${asset[@]}"; do
              [ -z "$a" ] && continue
              echo "Rimuovo $a dalla release $rel"
              gh release delete-asset "$rel" "$a" --yes || true
            done
          done

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffisso: win64
          - os: macos-latest
            suffisso: macOS
          - os: ubuntu-latest
            suffisso: linux64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Installa dipendenze di build
        run: pip install -r requirements-build.txt pyinstaller

      - name: Build con PyInstaller
        run: pyinstaller --noconfirm label-anything.spec
        env:
          APP_VERSION: ${{ needs.release.outputs.versione }}

      - name: Assembla Label Anything.app (macOS)
        if: runner.os == 'macOS'
        run: |
          versione="${{ needs.release.outputs.versione }}"
          mkdir -p "dist/Label Anything.app/Contents/MacOS" "dist/Label Anything.app/Contents/Resources"
          cp -R dist/LabelAnything/. "dist/Label Anything.app/Contents/MacOS/"
          ln -s MacOS/_internal "dist/Label Anything.app/Contents/Frameworks"
          sed "s/@VERSIONE@/$versione/g" scripts/Info-macos.plist > "dist/Label Anything.app/Contents/Info.plist"


      - name: Librerie Qt di sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Prepara immagini di test
        shell: bash
        run: |
          mkdir -p smoke/img
          python - <<'PY'
          import numpy as np, cv2
          for i in range(2):
              cv2.imwrite(f"smoke/img/img_{i}.png", np.zeros((32, 32, 3), dtype=np.uint8))
          PY

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 20 dist/LabelAnything/LabelAnything smoke/img
          codice=$?
          set -e
          [ "$codice" -eq 124 ] || { echo "Smoke test fallito (exit $codice)"; exit 1; }
          echo "Smoke test OK: l'app e' rimasta in esecuzione 20s senza crash"

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen "dist/Label Anything.app/Contents/MacOS/LabelAnything" smoke/img &
          pid=$!
          sleep 15
          kill -0 "$pid"
          codice=$?
          kill "$pid" 2>/dev/null
          wait "$pid" 2>/dev/null
          set -e
          [ "$codice" -eq 0 ] || { echo "Smoke test fallito (exit $codice)"; exit 1; }
          echo "Smoke test OK: l'app e' rimasta in esecuzione 15s senza crash"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist/LabelAnything/LabelAnything.exe" -ArgumentList "smoke/img" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Host "Smoke test fallito (exit $($p.ExitCode))"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Smoke test OK: l'app e' rimasta in esecuzione 15s senza crash"

      - name: Pacchetto (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          zip="LabelAnything-${{ needs.release.outputs.versione }}-${{ matrix.suffisso }}.zip"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cd dist && zip -r -y "../$zip" "Label Anything.app"
          else
            cd dist && zip -r "../$zip" LabelAnything
          fi

      - name: Pacchetto (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/LabelAnything -DestinationPath "LabelAnything-${{ needs.release.outputs.versione }}-${{ matrix.suffisso }}.zip"

      - name: Allega alla release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ needs.release.outputs.versione }}" "LabelAnything-${{ needs.release.outputs.versione }}-${{ matrix.suffisso }}.zip" --clobber
